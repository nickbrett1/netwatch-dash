[project]
name = "netwatch-dash"
version = "0.1.0"
description = "A netwatch-dash project generated with genproj"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    # Starlette's TestClient is an httpx2 client. `httpx` still works but warns
    # (StarletteDeprecationWarning, starlette 1.6.0), so depend on the one the
    # library actually wants. Not generator-owned — re-apply after a regen
    # (docs/genproj-target-gap.md §7, trap 7).
    "httpx2>=2.13"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src", "tests"]
# producers/ are verbatim copies of the scripts running on mac-studio. Their
# provenance (producers/README.md) depends on byte-identity, so they are never
# reformatted or linted here — drift is caught by CI running them, not by ruff.
#
# pyproject.toml is genproj-owned (infra) and is overwritten on every
# regeneration, so this has to be re-applied — docs/genproj-target-gap.md §7,
# trap 2.
extend-exclude = ["producers"]
