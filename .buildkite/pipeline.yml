# Generated by genproj. The pipeline itself is created during generation,
# together with its GitHub webhook — without that webhook a push triggers
# nothing at all, which is the failure mode to watch for.
#
# Which steps appear here is decided by the capabilities the project selects:
# the deployment capabilities contribute their deploy steps, gitguardian
# contributes the secret scan, lighthouse-ci the performance gate. The
# agent-side prerequisites for all of them are in .buildkite/README.md.

steps:
  - label: ":hammer: Build and test (python)"
    key: build
    agents:
      queue: mac-studio-linux
    env:
      RELEASE_TARGET: aarch64-apple-darwin
    # Uploaded so the release step can attach what this build produced and
    # tested instead of rebuilding it.
    artifact_paths:
      - "dist/**"
    commands:
      - python -m pip install --no-cache-dir -e ".[dev]"
      - python -m pip install --no-cache-dir build
      - python -m build
      - ruff check src tests
      - pytest -q

  - label: ":apple: Smoke-test (aarch64-apple-darwin)"
    key: smoke_aarch64_apple_darwin
    depends_on:
      - build
    # Main-only, like the release it gates: a darwin payload is only published
    # from main, and a native Mac job on every branch buys nothing the release
    # gate does not already cover.
    if: build.branch == "main"
    agents:
      queue: mac-studio-linux
    env:
      RELEASE_TARGET: aarch64-apple-darwin
    commands:
      - |
        # The payload this step runs is exactly what the build step uploaded. A
        # native step can call the agent binary directly; the release step cannot
        # (its Linux container cannot launch the macOS agent binary), which is
        # why that step uses the agent API instead.
        for pattern in "dist/**"; do
          buildkite-agent artifact download "$$pattern" .
        done
      - bash scripts/smoke-launch.sh "dist"

  - label: ":bookmark: Release"
    key: release
    depends_on:
      - build
      - smoke_aarch64_apple_darwin
    if: build.branch == "main"
    agents:
      queue: mac-studio-linux
    plugins:
      - docker#v5.13.0:
          image: "python:3.13-slim"
          # The fleet is Apple silicon. Without this, docker resolves a
          # multi-arch tag to linux/amd64 and runs the whole step emulated (with
          # a warning, and native modules built for the wrong architecture).
          platform: linux/arm64
          workdir: /workdir
          environment:
            - DOPPLER_TOKEN
            - BUILDKITE_AGENT_ACCESS_TOKEN
            - BUILDKITE_BUILD_ID
    commands:
      - |
        if ! command -v gh >/dev/null 2>&1; then
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates gnupg
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg -o /usr/share/keyrings/githubcli-archive-keyring.gpg
          chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" > /etc/apt/sources.list.d/github-cli.list
          apt-get update
          apt-get install -y --no-install-recommends gh
        fi
      - |
        if ! command -v doppler >/dev/null 2>&1; then
          apt-get update && apt-get install -y --no-install-recommends curl ca-certificates gpgv
          curl -Ls --tlsv1.2 --proto "=https" --retry 3 https://cli.doppler.com/install.sh | sh
        fi
      - |
        # Resolved at run time, never stored in the repository and never in the
        # agent's environment hook, where every job on the fleet could read it.
        export GH_TOKEN="$$(doppler secrets get GITHUB_RELEASE_TOKEN --project common --config prd --plain)"
        if [ -z "$$GH_TOKEN" ]; then
          echo "GITHUB_RELEASE_TOKEN is missing from Doppler (common/prd) - cannot release." >&2
          exit 1
        fi
      - |
        # The version is a patch bump of the newest existing tag, so there is no
        # version file to keep in sync and no bookkeeping to forget.
        git fetch --quiet --force --tags
        LATEST="$$(git tag --list 'v*' --sort=-v:refname | head -1)"
        if [ -z "$$LATEST" ]; then
          VERSION="0.1.0"
        else
          VERSION="$$(echo "$$LATEST" | sed -e 's/^v//' | awk -F. '{printf "%d.%d.%d", $$1, $$2, $$3 + 1}')"
        fi
        TAG="v$$VERSION"
        # Retried or re-run builds must not fail on a tag that already exists.
        if git ls-remote --exit-code --tags origin "refs/tags/$$TAG" >/dev/null 2>&1; then
          echo "$$TAG already exists on origin - nothing to release."
          exit 0
        fi
        echo "$$VERSION" > .release-version
        echo "$$TAG" > .release-tag
      - |
        # The tag is pushed with the release token explicitly, so this does not
        # depend on whatever credentials the agent happened to clone with. The
        # helper keeps the token out of the remote URL, where it would end up in
        # logs and in .git/config.
        TAG="$$(cat .release-tag)"
        git config user.name "genproj-release"
        git config user.email "genproj-release@users.noreply.github.com"
        git config --local credential.helper '!f() { echo username=x-access-token; echo password="$$GH_TOKEN"; }; f'
        git tag -a "$$TAG" -m "Release $$TAG"
        git push origin "refs/tags/$$TAG"
      - |
        # The build step uploaded what it compiled and the tests ran against;
        # this fetches those exact bytes back rather than rebuilding the tree.
        if ! command -v jq >/dev/null 2>&1; then
          apt-get update && apt-get install -y --no-install-recommends curl jq
        fi
        AGENT_API="https://agent-edge.buildkite.com/v3"
        for pattern in "dist/**"; do
          if curl -fsS -G -H "Authorization: Token $$BUILDKITE_AGENT_ACCESS_TOKEN" \
            --data-urlencode "query=$$pattern" --data-urlencode "state=finished" \
            "$$AGENT_API/builds/$$BUILDKITE_BUILD_ID/artifacts/search" -o /tmp/buildkite-artifacts.json; then
            if [ "$$(jq 'length' /tmp/buildkite-artifacts.json)" -eq 0 ]; then
              echo "No $$pattern artifacts to attach - the release will carry notes only."
            else
              jq -r '.[] | [.path, .url] | @tsv' /tmp/buildkite-artifacts.json |
                while IFS="$$(printf '\t')" read -r artifact_path artifact_url; do
                  mkdir -p "$$(dirname "$$artifact_path")"
                  curl -fsSL -o "$$artifact_path" "$$artifact_url" ||
                    echo "Failed to fetch $$artifact_path - the release may not carry it." >&2
                done
            fi
          else
            echo "Could not list this build's artifacts - the release will carry notes only." >&2
          fi
        done
      - |
        VERSION="$$(cat .release-version)"
        TAG="$$(cat .release-tag)"
        if [ -f scripts/release-artifacts.sh ]; then
          bash scripts/release-artifacts.sh "$$VERSION"
        else
          echo "No scripts/release-artifacts.sh - releasing notes only."
        fi
        # Uploaded in the create call so the release is never briefly visible
        # without its assets - a launcher reading releases/latest/download/...
        # must not race the upload.
        if [ -n "$$(ls -A release)" ]; then
          gh release create "$$TAG" --title "$$TAG" --generate-notes --verify-tag release/*
        else
          gh release create "$$TAG" --title "$$TAG" --generate-notes --verify-tag
        fi
